<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Comunidad Activa - Panel del Administrador</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>Panel de Administración - Solicitudes Pendientes</h1>
        <button id="btnLogout" class="btn-danger">Cerrar Sesión</button>
    </div>

    <div id="resultado"></div>

    <fieldset>
        <legend>Solicitudes de Membresía Pendientes de Aprobación</legend>
        <div id="solicitudesContenido">Cargando solicitudes...</div>
    </fieldset>

    <script type="module">
        import { RPCWebAPIFetch } from './js/api.js';

        if (!localStorage.getItem("accessToken")) {
            window.location.href = "login.html";
        }

        function mostrarResultado(mensaje, esError = false) {
            const resultado = document.getElementById("resultado");
            resultado.style.display = "block";
            resultado.style.backgroundColor = esError ? "#ffe6e6" : "#e6ffe6";
            resultado.style.color = esError ? "#cc0000" : "#006600";
            resultado.innerText = mensaje;

            if (esError) console.error("[ERROR]", mensaje);
            else console.log("[OK]", mensaje);
        }

        async function cargarSolicitudes() {
            const container = document.getElementById("solicitudesContenido");
            try {
                const response = await RPCWebAPIFetch("/listMembershipApplications", {});
                const aplicaciones = response.data.applications || [];

                if (aplicaciones.length === 0) {
                    container.innerText = response.data.message || "No hay solicitudes pendientes en este momento.";
                    return;
                }

                let html = '<table><thead><tr><th>Nombre y Apellido</th><th>DNI</th><th>Email</th><th>Teléfono</th><th>Acción</th></tr></thead><tbody>';

                aplicaciones.forEach(function (app) {
                    html += '<tr>' +
                                '<td>' + app.name + ' ' + app.surname + '</td>' +
                                '<td>' + app.dni + '</td>' +
                                '<td>' + app.email + '</td>' +
                                '<td>' + app.phone + '</td>' +
                                '<td>' +
                                    '<button onclick="aprobarSolicitud(' + app.idUser + ')" class="btn-warning">Aprobar</button> ' +
                                    '<button onclick="rechazarSolicitud(' + app.idUser + ')" class="btn-danger">Rechazar</button>' +
                                '</td>' +
                            '</tr>';
                });

                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                container.innerText = "Error al cargar las solicitudes: " + error.message;
            }
        }

        window.aprobarSolicitud = async function (idUser) {
            if (!confirm("¿Estás seguro de aprobar esta solicitud?")) return;

            try {
                const response = await RPCWebAPIFetch("/approveMembershipApplication", { idUser });
                mostrarResultado(response.data.message || "Solicitud aprobada con éxito", false);
                cargarSolicitudes();
            } catch (error) {
                mostrarResultado("Error al aprobar: " + error.message, true);
            }
        };

        window.rechazarSolicitud = async function (idUser) {
            if (!confirm("¿Estás seguro de rechazar esta solicitud?")) return;

            try {
                const response = await RPCWebAPIFetch("/rejectMembershipApplication", { idUser });
                mostrarResultado(response.data.message || "Solicitud rechazada con éxito", false);
                cargarSolicitudes();
            } catch (error) {
                mostrarResultado("Error al rechazar: " + error.message, true);
            }
        };

        async function onBtnLogoutClick() {
            try {
                await RPCWebAPIFetch("/logout", {});
            } catch (e) {
                console.warn("Logout warning:", e.message);
            }
            localStorage.removeItem("accessToken");
            window.location.href = "login.html";
        }

        document.getElementById("btnLogout").onclick = onBtnLogoutClick;

        cargarSolicitudes();
    </script>
</body>

</html>
