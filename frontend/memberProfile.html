<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad Activa - Mi Panel</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/profiles.css">
</head>

<body>

    <!-- ========================================== -->
    <!-- HEADER                                     -->
    <!-- ========================================== -->
    <div class="socio-header">
        <h1 id="greeting">Mi Panel</h1>
        <div class="socio-header-actions">
            <a href="changePassword.html" class="btn btn-warning">Cambiar Contraseña</a>
            <button id="logoutButton" class="btn btn-danger">Cerrar Sesión</button>
            <button id="deactivateMembershipButton" class="btn btn-danger">
                Darme de baja del club
            </button>
        </div>
    </div>

    <div id="resultMessage"></div>

    <!-- ========================================== -->
    <!-- MIS DATOS PERSONALES                       -->
    <!-- ========================================== -->
    <section class="socio-section">
        <h2>Mis Datos Personales</h2>
        <div id="profileContainer">
            <p class="empty-msg">Cargando información del perfil...</p>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- ACTIVIDADES DISPONIBLES                    -->
    <!-- ========================================== -->
    <section class="socio-section">
        <h2>Actividades del Club</h2>
        <p style="color: #64748b; margin-top: -8px;">Estas son las actividades disponibles para inscribirse en el club.
        </p>
        <div id="activitiesContainer">
            <p class="empty-msg">Cargando actividades...</p>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- MIS INSCRIPCIONES                          -->
    <!-- ========================================== -->
    <section class="socio-section">
        <h2>Mis Inscripciones</h2>
        <div id="enrollmentsContainer">
            <p class="empty-msg">Cargando tus inscripciones...</p>
        </div>
    </section>

    <!-- ========================================== -->
    <!-- JAVASCRIPT                                 -->
    <!-- ========================================== -->
    <script type="module">
        import { RPCWebAPIFetchPrivate } from './js/api.js';
        import { formatDate, handleLogout } from './js/helpers.js';
        import { clearContainer, createActivityCard } from './js/domUtils.js';

        // --- Elementos del DOM ---
        const profileContainer = document.getElementById("profileContainer");
        const activitiesContainer = document.getElementById("activitiesContainer");
        const enrollmentsContainer = document.getElementById("enrollmentsContainer");

        if (!localStorage.getItem("accessToken")) {
            window.location.href = "login.html";
        }

        async function onDeactivateMembershipClick() {
            const confirmed = confirm("¿Estás seguro de que querés darte de baja del club?");

            if (!confirmed) {
                return;
            }

            const button = document.getElementById("deactivateMembershipButton");

            button.disabled = true;
            button.textContent = "Procesando...";

            try {
                const response = await RPCWebAPIFetchPrivate("/deactivateMyMembership", {});

                alert(response.data.message || "Tu membresía fue dada de baja correctamente.");

                // Se elimina el token del navegador.
                localStorage.removeItem("accessToken");
                localStorage.removeItem("userRole");
                
                // Se redirige al login.
                window.location.href = "login.html";

            } catch (error) {
                alert("No se pudo dar de baja la membresía: " + error.message);

                button.disabled = false;
                button.textContent = "Darme de baja del club";
            }
        }

        // Función auxiliar local para crear campos del perfil
        function createProfileField(labelText, valueText) {
            var field = document.createElement("div");
            field.className = "profile-field";

            var label = document.createElement("label");
            label.textContent = labelText;

            var span = document.createElement("span");
            span.textContent = valueText;

            field.appendChild(label);
            field.appendChild(span);
            return field;
        }

        // ==========================================
        // 1. CARGAR PERFIL
        // ==========================================
        async function loadProfile() {
            clearContainer(profileContainer);

            try {
                const response = await RPCWebAPIFetchPrivate("/getMemberProfile", {});
                const profile = response.data.profile;

                document.getElementById("greeting").innerText = "Hola, " + profile.name;

                var grid = document.createElement("div");
                grid.className = "profile-grid";

                grid.appendChild(createProfileField("Nombre", profile.name));
                grid.appendChild(createProfileField("Apellido", profile.surname));
                grid.appendChild(createProfileField("DNI", profile.dni));
                grid.appendChild(createProfileField("Fecha Nac.", formatDate(profile.birthdate)));
                grid.appendChild(createProfileField("Email", profile.email));

                // --- Campo Teléfono con botón de Editar ---
                var phoneField = document.createElement("div");
                phoneField.className = "profile-field";
                phoneField.id = "phoneField";

                var phoneLabel = document.createElement("label");
                phoneLabel.textContent = "Teléfono";

                var phoneWrap = document.createElement("div");
                phoneWrap.style.display = "flex";
                phoneWrap.style.alignItems = "center";
                phoneWrap.style.gap = "10px";

                var phoneSpan = document.createElement("span");
                phoneSpan.id = "phoneDisplay";
                phoneSpan.textContent = profile.phone;

                var editBtn = document.createElement("button");
                editBtn.className = "btn btn-warning";
                editBtn.id = "editPhoneBtn";
                editBtn.className = "btn btn-warning phone-edit-btn";
                editBtn.textContent = "Editar";

                phoneWrap.appendChild(phoneSpan);
                phoneWrap.appendChild(editBtn);
                phoneField.appendChild(phoneLabel);
                phoneField.appendChild(phoneWrap);
                grid.appendChild(phoneField);

                profileContainer.appendChild(grid);

            } catch (error) {
                if (error.status === 401) {
                    localStorage.removeItem("accessToken");
                    localStorage.removeItem("userRole");
                    window.location.href = "login.html";
                    return;
                }
                var errP = document.createElement("p");
                errP.className = "empty-msg";
                errP.textContent = "Error al cargar el perfil: " + error.message;
                profileContainer.appendChild(errP);
            }
        }

        // ==========================================
        // 2. EDITAR TELÉFONO (Modo Edición)
        // ==========================================
        function onEditPhoneClick() {
            const phoneField = document.getElementById("phoneField");
            const currentPhone = document.getElementById("phoneDisplay").innerText;

            clearContainer(phoneField);

            var label = document.createElement("label");
            label.textContent = "Teléfono";
            phoneField.appendChild(label);

            var wrap = document.createElement("div");
            wrap.style.display = "flex";
            wrap.style.alignItems = "center";
            wrap.style.gap = "10px";

            var input = document.createElement("input");
            input.type = "tel";
            input.id = "phoneInput";
            input.value = currentPhone;
            input.className = "phone-edit-input";

            var saveBtn = document.createElement("button");
            saveBtn.className = "btn btn-success";
            saveBtn.id = "savePhoneBtn";
            saveBtn.className = "btn btn-success phone-edit-btn";
            saveBtn.textContent = "Guardar";

            var cancelBtn = document.createElement("button");
            cancelBtn.className = "btn btn-danger";
            cancelBtn.id = "cancelPhoneBtn";
            cancelBtn.className = "btn btn-danger phone-edit-btn";
            cancelBtn.textContent = "Cancelar";

            wrap.appendChild(input);
            wrap.appendChild(saveBtn);
            wrap.appendChild(cancelBtn);
            phoneField.appendChild(wrap);

            saveBtn.onclick = onSavePhoneClick;
            cancelBtn.onclick = onCancelPhoneClick;
            input.focus();
        }

        async function onSavePhoneClick() {
            const newPhone = document.getElementById("phoneInput").value.trim();

            if (!newPhone) {
                alert("El teléfono no puede estar vacío.");
                return;
            }

            const saveBtn = document.getElementById("savePhoneBtn");
            saveBtn.disabled = true;
            saveBtn.innerText = "Guardando...";

            try {
                await RPCWebAPIFetchPrivate("/updateMemberProfile", { phone: newPhone });
                await loadProfile();
                alert("¡Teléfono actualizado correctamente!");
            } catch (error) {
                alert("Error al actualizar el teléfono: " + error.message);
                saveBtn.disabled = false;
                saveBtn.innerText = "Guardar";
            }
        }

        function onCancelPhoneClick() {
            loadProfile();
        }

        // ==========================================
        // 3. LISTAR ACTIVIDADES DISPONIBLES
        // ==========================================
        async function loadActivities() {
            clearContainer(activitiesContainer);

            try {
                const response = await RPCWebAPIFetchPrivate("/listActiveActivities", {});
                const activities = response.data.activities || [];

                if (activities.length === 0) {
                    var emptyP = document.createElement("p");
                    emptyP.className = "empty-msg";
                    emptyP.textContent = "No hay actividades cargadas.";
                    activitiesContainer.appendChild(emptyP);
                    return;
                }

                var grid = document.createElement("div");
                grid.className = "activities-grid";

                for (var i = 0; i < activities.length; i++) {
                    var card = createActivityCard(activities[i], {
                        showEnrollButton: true,
                        showCapacity: true
                    });
                    grid.appendChild(card);
                }

                activitiesContainer.appendChild(grid);

            } catch (error) {
                var errP = document.createElement("p");
                errP.className = "empty-msg";
                errP.textContent = "Error al cargar actividades: " + error.message;
                activitiesContainer.appendChild(errP);
            }
        }

        // ==========================================
        // 4. LISTAR MIS INSCRIPCIONES
        // ==========================================
        async function loadEnrollments() {
            clearContainer(enrollmentsContainer);

            try {
                const response = await RPCWebAPIFetchPrivate("/listMemberRegistrations", {});
                const enrollments = response.data.enrollments || [];

                if (enrollments.length === 0) {
                    var emptyP = document.createElement("p");
                    emptyP.className = "empty-msg";
                    emptyP.textContent = "Todavía no estás inscripto en ninguna actividad.";
                    enrollmentsContainer.appendChild(emptyP);
                    return;
                }

                var grid = document.createElement("div");
                grid.className = "activities-grid";

                for (var i = 0; i < enrollments.length; i++) {
                    var card = createActivityCard(enrollments[i], {
                        isEnrolled: true
                    });
                    grid.appendChild(card);
                }

                enrollmentsContainer.appendChild(grid);

            } catch (error) {
                var errP = document.createElement("p");
                errP.className = "empty-msg";
                errP.textContent = "Error al cargar tus inscripciones: " + error.message;
                enrollmentsContainer.appendChild(errP);
            }
        }

        // ==========================================
        // 5. MANEJADORES DE EVENTOS
        // ==========================================
        async function onEnrollClick(event) {
            const button = event.target.closest(".enroll-btn");
            if (!button) return;

            const activityId = parseInt(button.getAttribute("data-id"), 10);

            if (!confirm("¿Confirmás tu inscripción a esta actividad?")) return;

            button.disabled = true;
            button.innerText = "Inscribiendo...";

            try {
                const response = await RPCWebAPIFetchPrivate("/registerMemberToActivity", { idActivity: activityId });
                alert(response.data.message || "¡Inscripción exitosa!");

                loadActivities();
                loadEnrollments();
            } catch (error) {
                alert("Error al inscribirse: " + error.message);
                button.disabled = false;
                button.innerText = "Inscribirme";
            }
        }

        // ==========================================
        // 6. CANCELAR INSCRIPCIÓN
        // ==========================================
        async function onCancelEnrollmentClick(event) {
            const button = event.target.closest(".cancel-enrollment-btn");
            if (!button) return;

            const activityId = parseInt(button.getAttribute("data-id"), 10);

            if (!confirm("¿Estás seguro que querés cancelar tu inscripción a esta actividad?")) return;

            button.disabled = true;
            button.innerText = "Cancelando...";

            try {
                const response = await RPCWebAPIFetchPrivate("/cancelRegistration", { idActivity: activityId });
                alert(response.data.message || "Inscripción cancelada correctamente.");

                // Recargamos ambas listas (la inscripción desaparece y el cupo en la actividad vuelve a estar libre)
                loadActivities();
                loadEnrollments();
            } catch (error) {
                alert("Error al cancelar la inscripción: " + error.message);
                button.disabled = false;
                button.innerText = "Cancelar Inscripción";
            }
        }

        // ==========================================
        // 7. INICIALIZACIÓN
        // ==========================================
        function main() {
            // Botón de cerrar sesión
            document.getElementById("logoutButton").onclick = function () {
                handleLogout(RPCWebAPIFetchPrivate);
            };

            document.getElementById("deactivateMembershipButton").onclick = onDeactivateMembershipClick;

            // Delegación de eventos para el botón "Inscribirme"
            activitiesContainer.onclick = onEnrollClick;
            enrollmentsContainer.onclick = onCancelEnrollmentClick;

            // Delegación de eventos para el botón "Editar" teléfono
            profileContainer.onclick = function (event) {
                if (event.target.id === "editPhoneBtn") {
                    onEditPhoneClick();
                }
            };

            // Cargamos los datos iniciales
            loadProfile();
            loadActivities();
            loadEnrollments();
        }

        window.onload = main;
    </script>
</body>

</html>
