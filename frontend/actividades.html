<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidad Activa - Panel del Socio</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>Comunidad Activa - Panel del Socio</h1>
        <button id="btnLogout" class="btn-danger">Cerrar Sesión</button>
    </div>

    <div id="resultado"></div>

    <!-- MIS DATOS PERSONALES -->
    <fieldset>
        <legend>Mis Datos Personales</legend>
        <div id="perfilContenido">Cargando información del perfil...</div>
    </fieldset>

    <!-- MIS ACTIVIDADES (INSCRIPTO) -->
    <fieldset>
        <legend>Actividades Disponibles en el Club</legend>
        <div id="actividadesDisponiblesContenido">Cargando actividades...</div>
    </fieldset>

    <script type="module">
        import { RPCWebAPIFetch } from './js/api.js';

        if (!localStorage.getItem("accessToken")) {
            window.location.href = "login.html";
        }

        function mostrarResultado(mensaje, esError = false) {
            const resultado = document.getElementById("resultado");
            resultado.style.display = "block";
            resultado.style.backgroundColor = esError ? "#ffe6e6" : "#e6ffe6";
            resultado.style.color = esError ? "#cc0000" : "#006600";
            resultado.innerText = mensaje;

            if (esError) console.error("[ERROR]", mensaje);
            else console.log("[OK]", mensaje);
        }

        async function logout() {
            try {
                const payload = await RPCWebAPIFetch("/logout", {});
                mostrarResultado(payload.data.message || "Sesión cerrada");
            } catch (error) {
                console.warn("Logout warning:", error.message);
            } finally {
                localStorage.removeItem("accessToken");
                window.location.href = "login.html";
            }
        }

        async function cargarPerfil() {
            // Endpoint todavía no implementado en el backend.
            // Cuando exista (por ej. POST /getMemberProfile), reemplazar por:
            //   const response = await RPCWebAPIFetch("/getMemberProfile", {});
            //   document.getElementById("perfilContenido").innerText = ...
            document.getElementById("perfilContenido").innerText =
                "Tu perfil va a mostrarse acá cuando el endpoint esté disponible.";
        }

        async function cargarActividadesDisponibles() {
            const container = document.getElementById("actividadesDisponiblesContenido");
            try {
                const response = await RPCWebAPIFetch("/listActivities", {});
                const actividades = response.data.activities || [];

                if (actividades.length === 0) {
                    container.innerText = response.data.message || "No hay actividades cargadas todavía.";
                    return;
                }

                let html = '<table><thead><tr><th>Actividad</th><th>Día</th><th>Horario</th><th>Profesor</th></tr></thead><tbody>';
                actividades.forEach(a => {
                    html += `<tr>
                        <td>${a.name}</td>
                        <td>${a.day}</td>
                        <td>${a.startTime} a ${a.endTime}</td>
                        <td>${a.instructor || "—"}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                container.innerText = "Error al cargar actividades: " + error.message;
                console.error("[actividades]", error);
            }
        }

        async function cargarActividades() {
            // Endpoint de inscripciones todavía no implementado.
            // Cuando exista (por ej. POST /myActivities), reemplazar por:
            //   const response = await RPCWebAPIFetch("/myActivities", {});
            //   ...
            document.getElementById("misActividadesContenido").innerText =
                "Tus actividades inscriptas van a mostrarse acá cuando el endpoint esté disponible.";
        }

        document.getElementById("btnLogout").addEventListener("click", logout);

        cargarPerfil();
        cargarActividades();
        cargarActividadesDisponibles();

    </script>
</body>

</html>
