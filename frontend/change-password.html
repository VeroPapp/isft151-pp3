<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Comunidad Activa</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <h1>Cambiar contraseña</h1>

    <form id="changePasswordForm">
        <label for="currentPassword">Contraseña actual:</label>
        <input type="password" id="currentPassword" name="currentPassword" required>

        <label for="newPassword">Nueva contraseña:</label>
        <input type="password" id="newPassword" name="newPassword" required>

        <label for="confirmPassword">Confirmar contraseña:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>

        <br><br>

        <button type="submit" id="btnSubmit">Cambiar contraseña</button>
    </form>

    <div id="resultado"></div>

    <script type="module">
        import { RPCWebAPIFetch } from './js/api.js';

        if (!localStorage.getItem("accessToken")) {
            window.location.href = "login.html";
        }

        let isChangingPassword = false;

        function mostrarResultado(mensaje, esError = false) {
            const div = document.getElementById("resultado");
            div.style.display = "block";
            div.style.backgroundColor = esError ? "#ffe6e6" : "#e6ffe6";
            div.style.color = esError ? "#cc0000" : "#006600";
            div.innerText = mensaje;

            if (esError) console.error("[ERROR]", mensaje);
            else console.log("[OK]", mensaje);
        }

        document.getElementById("changePasswordForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            if (isChangingPassword) return;
            isChangingPassword = true;

            const btn = document.getElementById("btnSubmit");
            btn.disabled = true;

            const currentPassword = document.getElementById("currentPassword").value;
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            try {
                const response = await RPCWebAPIFetch("/changePassword", {
                    currentPassword,
                    newPassword,
                    confirmPassword
                });

                mostrarResultado(
                    response.data.message || "Contraseña modificada correctamente.",
                    false
                );

                // El backend actualiza el estado a ACTIVE, pero no genera un token nuevo.
                // El usuario debe volver a loguearse con la nueva contraseña.
                setTimeout(() => {
                    localStorage.removeItem("accessToken");
                    window.location.href = "login.html";
                }, 1500);

            } catch (error) {
                mostrarResultado("No se pudo cambiar la contraseña: " + error.message, true);
            } finally {
                isChangingPassword = false;
                btn.disabled = false;
            }
        });
    </script>
</body>

</html>
