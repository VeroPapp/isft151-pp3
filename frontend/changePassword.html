<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Comunidad Activa</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="icon" href="./assets/favicon.ico">
</head>
<body class="password-page">
    <div class="password-card">
        <div>
            <h1>Cambiar contraseña</h1>
            <p class="subtitle">Ingresá tu contraseña actual y elegí una nueva.</p>

            <form id="changePasswordForm" novalidate onsubmit="event.preventDefault();">
                <label for="currentPassword">Contraseña actual</label>
                <div class="password-input-wrap">
                    <input type="password" id="currentPassword" autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="currentPassword" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
                </div>

                <label for="newPassword">Nueva contraseña</label>
                <div class="password-input-wrap">
                    <input type="password" id="newPassword" autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="newPassword" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
                </div>

                <label for="confirmPassword">Confirmar nueva contraseña</label>
                <div class="password-input-wrap">
                    <input type="password" id="confirmPassword" autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
                </div>

                <div class="password-hint">
                    <strong>Requisitos de la nueva contraseña:</strong>
                    <ul>
                        <li>Mínimo 8 caracteres</li>
                        <li>Al menos una mayúscula y una minúscula</li>
                        <li>Al menos un número</li>
                        <li>Al menos un carácter especial (!@#$%^&*...)</li>
                    </ul>
                </div>

                <div id="resultMessage" role="alert" aria-live="polite"></div>

                <button type="submit" id="submitButton">Cambiar contraseña</button>
            </form>

            <a href="#" id="backLink" class="login-back">← Volver al panel</a>
        </div>
    </div>

    <script type="module">
        import { setupPasswordToggle } from './js/shared/helpers.js';
        import { setupBackLink, onChangePasswordSubmit, clearError } from './js/auth/changePassword.js';

        // Validación de sesión
        if (!localStorage.getItem("accessToken")) {
            window.location.href = "login.html";
        }

        // Inicialización directa
        setupPasswordToggle();
        setupBackLink();

        // Limpiar error al escribir
        const passwordFields = ["currentPassword", "newPassword", "confirmPassword"];
        passwordFields.forEach(function(id) {
            document.getElementById(id).addEventListener("input", clearError);
        });

        // Atar submit
        document.getElementById("changePasswordForm").onsubmit = onChangePasswordSubmit;
    </script>
</body>
</html>
