<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña - Comunidad Activa</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="password-page">
    <div class="password-card">
        <div>
            <h1>Cambiar contraseña</h1>
            <p class="subtitle">Ingresá tu contraseña actual y elegí una nueva.</p>

            <form id="changePasswordForm" novalidate>
                <label for="currentPassword">Contraseña actual</label>
                <div class="password-input-wrap">
                    <input type="password" id="currentPassword" autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="currentPassword" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
                </div>

                <label for="newPassword">Nueva contraseña</label>
                <div class="password-input-wrap">
                    <input type="password" id="newPassword" autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="newPassword" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
                </div>

                <label for="confirmPassword">Confirmar nueva contraseña</label>
                <div class="password-input-wrap">
                    <input type="password" id="confirmPassword" autocomplete="new-password">
                    <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
                </div>

                <div class="password-hint">
                    <strong>Requisitos de la nueva contraseña:</strong>
                    <ul>
                        <li>Mínimo 8 caracteres</li>
                        <li>Al menos una mayúscula y una minúscula</li>
                        <li>Al menos un número</li>
                        <li>Al menos un carácter especial (!@#$%^&*...)</li>
                    </ul>
                </div>

                <div id="resultMessage" role="alert" aria-live="polite"></div>

                <button type="submit" id="submitButton">Cambiar contraseña</button>
            </form>

            <a href="#" id="backLink" class="login-back">← Volver al panel</a>
        </div>
    </div>

    <script type="module">
        import { RPCWebAPIFetchPrivate } from './js/api.js';
        import { setupPasswordToggle } from './js/helpers.js';

        // ==========================================
        // VALIDACIONES INICIALES Y CONFIGURACIÓN
        // ==========================================
        if (!localStorage.getItem("accessToken")) {
            window.location.href = "login.html";
        }

        setupPasswordToggle();

        const resultDiv = document.getElementById("resultMessage");
        const submitButton = document.getElementById("submitButton");
        const backLink = document.getElementById("backLink");
        let isSubmitting = false;

        // Ocultar el botón de "Volver" si el cambio es obligatorio
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mandatory') === 'true') {
            backLink.style.display = "none";
        }

        // Configurar el enlace de "Volver" según el rol
        const role = localStorage.getItem("userRole");
        if (role === "CLUB_ADMIN" || role === "SUPER_ADMIN") {
            backLink.href = "adminProfile.html";
        } else {
            backLink.href = "memberProfile.html";
        }

        // ==========================================
        // FUNCIONES DE LA VISTA
        // ==========================================
        function showError(message, fieldId) {
            resultDiv.style.display = "block";
            resultDiv.className = "error shake";
            resultDiv.innerHTML = `<span>⚠️</span> ${message}`;
            console.error("[change-password]", message);

            document.querySelectorAll(".password-input-wrap input").forEach(function(input) {
                input.classList.remove("invalid");
            });

            if (fieldId) {
                const field = document.getElementById(fieldId);
                if (field) {
                    field.classList.add("invalid");
                    field.focus();
                }
            }

            setTimeout(function() {
                resultDiv.classList.remove("shake");
            }, 500);
        }

        function clearError() {
            resultDiv.className = "";
            resultDiv.innerText = "";
            resultDiv.style.display = "";

            document.querySelectorAll(".password-input-wrap input").forEach(function(input) {
                input.classList.remove("invalid");
            });
        }

        function validatePasswordStrength(password) {
            if (password.length < 8) return "La nueva contraseña debe tener al menos 8 caracteres.";
            if (!/[A-Z]/.test(password)) return "La nueva contraseña debe incluir al menos una letra mayúscula.";
            if (!/[a-z]/.test(password)) return "La nueva contraseña debe incluir al menos una letra minúscula.";
            if (!/[0-9]/.test(password)) return "La nueva contraseña debe incluir al menos un número.";
            if (!/[!@#$%^&*(),.?":{}|<>_+\-=]/.test(password)) return "La nueva contraseña debe incluir al menos un carácter especial.";
            return null;
        }

        // ==========================================
        // MANEJADOR DEL FORMULARIO
        // ==========================================
        async function onChangePasswordSubmit(event) {
            event.preventDefault();

            if (isSubmitting) return;
            clearError();

            const currentPasswordInput = document.getElementById("currentPassword");
            const newPasswordInput = document.getElementById("newPassword");
            const confirmPasswordInput = document.getElementById("confirmPassword");

            const currentPassword = currentPasswordInput.value;
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            // Validaciones locales
            if (!currentPassword) {
                showError("Ingresá tu contraseña actual.", "currentPassword");
                return;
            }

            if (!newPassword) {
                showError("Ingresá la nueva contraseña.", "newPassword");
                return;
            }

            const strengthError = validatePasswordStrength(newPassword);
            if (strengthError) {
                showError(strengthError, "newPassword");
                return;
            }

            if (!confirmPassword) {
                showError("Confirmá la nueva contraseña.", "confirmPassword");
                return;
            }

            if (newPassword !== confirmPassword) {
                showError("La nueva contraseña y la confirmación no coinciden.", "confirmPassword");
                return;
            }

            if (newPassword === currentPassword) {
                showError("La nueva contraseña no puede ser igual a la actual.", "newPassword");
                return;
            }

            // Envío al Backend
            isSubmitting = true;
            submitButton.disabled = true;
            submitButton.textContent = "Cambiando...";

            try {
                await RPCWebAPIFetchPrivate("/changePassword", {
                    currentPassword: currentPassword,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                });

                // Si sale bien, deslogueamos y mandamos al login
                localStorage.removeItem("accessToken");
                localStorage.removeItem("userRole");
                window.location.replace("login.html");

            } catch (error) {
                let errorMessage;
                if (error.detail === "NetworkError") {
                    errorMessage = "No se pudo conectar con el servidor. Verificá que el backend esté corriendo.";
                } else {
                    errorMessage = error.message || "No se pudo cambiar la contraseña.";
                }

                showError(errorMessage);
                isSubmitting = false;
                submitButton.disabled = false;
                submitButton.textContent = "Cambiar contraseña";
            }
        }

        // ==========================================
        // INICIALIZACIÓN
        // ==========================================
        function main() {
            // Atamos el evento input a los 3 campos para limpiar el error al escribir
            const passwordFields = ["currentPassword", "newPassword", "confirmPassword"];
            passwordFields.forEach(function(id) {
                document.getElementById(id).addEventListener("input", clearError);
            });

            // Atamos el submit del formulario
            document.getElementById("changePasswordForm").onsubmit = onChangePasswordSubmit;
        }

        window.onload = main;
    </script>
</body>
</html>
