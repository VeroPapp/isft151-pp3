<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Comunidad Activa</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>Iniciar Sesión</h1>

        <form id="loginForm">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">

            <label for="password">Contraseña</label>
            <div class="password-input-wrap">
                <input type="password" id="password" required autocomplete="current-password">
                <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
            </div>

            <div id="resultMessage" class="login-result" role="alert" aria-live="assertive"></div>

            <button type="submit" id="loginButton">Ingresar</button>
        </form>

        <a href="index.html" class="login-back">← Volver al inicio</a>
    </div>

    <script type="module">
        import { RPCWebAPIFetchPublic } from './js/api.js';
        import { setupPasswordToggle, showMessage } from './js/helpers.js';

        setupPasswordToggle();

        async function onLoginSubmit(event) {
            event.preventDefault();
            
            const button = document.getElementById("loginButton");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage("resultMessage", "Los datos ingresados son incorrectos.", true);
                emailInput.value = "";
                passwordInput.value = "";
                emailInput.focus();
                return;
            }
            
            button.disabled = true;
            button.innerText = "Ingresando...";

            try {
                const response = await RPCWebAPIFetchPublic("/login", { email: email, password: password });
                const user = response.data.user;
                localStorage.setItem("userRole", user.role || "");

                if (response.data.redirectToChangePassword) {
                    window.location.href = "changePassword.html?mandatory=true";
                    return;
                }

                if (user.role === "CLUB_ADMIN" || user.role === "SUPER_ADMIN") {
                    window.location.href = "adminProfile.html";
                } else {
                    window.location.href = "memberProfile.html";
                }

            } catch (error) {
                showMessage("resultMessage", error.message || "Los datos ingresados son incorrectos.", true);
                emailInput.value = "";
                passwordInput.value = "";
                button.disabled = false;
                button.innerText = "Ingresar";
                emailInput.focus(); 
            }
        }

        function main() {
            document.getElementById("loginForm").onsubmit = onLoginSubmit;
        }

        window.onload = main;
    </script>
</body>
</html>
