<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Comunidad Activa</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        body.login-page {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a7f4f 0%, #16a34a 100%);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .login-card h1 {
            margin: 0 0 24px;
            text-align: center;
            color: #0f5a37;
        }

        .login-card label {
            display: block;
            font-weight: 500;
            margin-bottom: 6px;
            margin-top: 16px;
            color: #1e293b;
        }

        .login-card input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
        }

        .login-card input:focus {
            outline: none;
            border-color: #1a7f4f;
            box-shadow: 0 0 0 3px rgba(26, 127, 79, 0.1);
        }

        .login-card button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            background: #1a7f4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .login-card button:hover { background: #0f5a37; }
        .login-card button:disabled { opacity: 0.6; cursor: not-allowed; }

        .login-result {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
        }

        .login-result:empty { display: none; }
        .login-result-ok { background: #dcfce7; color: #166534; }
        .login-result-error { background: #fee2e2; color: #991b1b; }

        .login-back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .login-back:hover { color: #1a7f4f; }
    </style>
</head>

<body class="login-page">
    <div class="login-card">
        <h1>Iniciar Sesión</h1>

        <form id="loginForm">
            <label for="txtEmail">Email</label>
            <input type="email" id="txtEmail" required autocomplete="email">

            <label for="txtPass">Contraseña</label>
            <input type="password" id="txtPass" required autocomplete="current-password">

            <button type="submit" id="btnLogin">Ingresar</button>
        </form>

        <div id="resultado" class="login-result"></div>

        <a href="index.html" class="login-back">← Volver al inicio</a>
    </div>

    <script type="module">
        import { RPCWebAPIFetch } from './js/api.js';

        async function onLoginSubmit(e) {
            e.preventDefault();
            const resultado = document.getElementById("resultado");
            const btn = document.getElementById("btnLogin");

            const email = document.getElementById("txtEmail").value.trim();
            const password = document.getElementById("txtPass").value;

            btn.disabled = true;
            resultado.className = "login-result";
            resultado.innerText = "";

            try {
                const response = await RPCWebAPIFetch("/login", { email, password });
                const user = response.data.user || response.data;

                resultado.className = "login-result login-result-ok";
                resultado.innerText = `¡Bienvenido ${user.name || ""}!`;

                if (response.data.redirectToChangePassword) {
                    window.location.href = "change-password.html";
                    return;
                }

                if (user.role === "CLUB_ADMIN" || user.role === "SUPER_ADMIN") {
                    window.location.href = "admin.html";
                } else {
                    window.location.href = "socio.html";
                }
            } catch (error) {
                resultado.className = "login-result login-result-error";
                resultado.innerText = error.message;
                console.error("[login]", error);
                btn.disabled = false;
            }
        }

        document.getElementById("loginForm").addEventListener("submit", onLoginSubmit);
    </script>
</body>

</html>
