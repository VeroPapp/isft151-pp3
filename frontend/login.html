<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Comunidad Activa</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="icon" href="./assets/favicon.ico">
</head>
<body class="login-page">
    <div class="login-card">
        <h1>Iniciar Sesión</h1>

        <form id="loginForm" onsubmit="event.preventDefault();">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">

            <label for="password">Contraseña</label>
            <div class="password-input-wrap">
                <input type="password" id="password" required autocomplete="current-password">
                <button type="button" class="toggle-password" data-target="password" aria-label="Mostrar contraseña" title="Mostrar/ocultar">👁</button>
            </div>

            <div id="resultMessage" class="login-result" role="alert" aria-live="assertive"></div>

            <button type="submit" id="loginButton">Ingresar</button>
        </form>

        <a href="index.html" class="login-back">← Volver al inicio</a>
    </div>

    <script type="module">
        import { setupPasswordToggle } from './js/shared/helpers.js';
        import { onLoginSubmit } from './js/auth/login.js';

        // Inicialización directa
        setupPasswordToggle();
        document.getElementById("loginForm").onsubmit = onLoginSubmit;
    </script>
</body>
</html>
